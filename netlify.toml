# index.html is generated by the build into dist/ (dist/ is not in git).
# These settings override whatever is set in the Netlify UI.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"   # sharp needs Node >= 20.9

# Single static page with in-page anchors only, so there is no SPA fallback
# on purpose: a catch-all would turn missing assets into 200s.

# Demo site: keep it out of search engines.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
